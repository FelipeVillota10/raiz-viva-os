name: Compuertas de Calidad - Rama Desarrollo

on:
  pull_request:
    branches: [desarrollo]
  push:
    branches: [desarrollo]
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa-backend:
    name: QA Verificaciones (Backend)
    runs-on: ubuntu-latest
    

    #GitHub ejecuta todos los comandos dentro de la carpeta del backend.
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias de Raíz Viva
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      - name: Validar Sintaxis del Código # Por si hay algun fallo de sintaxis
        run: python -m compileall .

      # Escanea de vulnerabilidades en las librerías
      - name: QA Seguridad - Escaneo de librerías (Safety)
        run: safety check -r requirements.txt
        continue-on-error: true 

      # Análisis estático de seguridad en el código del backend
      - name: QA Seguridad - Análisis Estático (Bandit)
        run: bandit -r . -x ./tests
        continue-on-error: true 
      

      # Ejecuta las pruebas unitarias de Django
      - name: QA Funcional - Pruebas Unitarias (Django)
        run: python manage.py test
        
  # frontend
  qa-frontend:
    name: QA Verificaciones (Frontend celula por celula porque asi esta apps/fronted/celulaX/package.json)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar e Integrar Todas las Células
        run: |
          cd apps/frontend
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo "================================================================="
              echo "comprobando componente: ${dir%/}"
              echo "================================================================="
              
              cd "$dir"
              
              echo "se estan instalando las dependencias"
              npm ci
              
              echo "se valida el codigo"
              npm run lint || echo "Esto detecto unas advertencias menores en ${dir%/}"
              
              echo "compilando el proyecto, frontend"
              if ! npm run build; then
                echo "Pucha el build de la celula [${dir%/}] falló"
                exit 1
              fi
              
              cd ..
            fi
          done
