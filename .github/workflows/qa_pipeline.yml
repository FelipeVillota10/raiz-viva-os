name: Compuertas de Calidad - Rama Pipeline de prueba

on:
  pull_request:
    branches: [feature/infra-pipeline-qa]
  push:
    branches: [feature/infra-pipeline-qa]

jobs:
  qa-backend:
    name: QA Verificaciones (Backend)
    runs-on: ubuntu-latest
    

    #GitHub ejecuta todos los comandos dentro de la carpeta del backend
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias de Raíz Viva
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      # Escanea de vulnerabilidades en las librerías
      - name: QA Seguridad - Escaneo de librerías (Safety)
        run: safety check -r requirements.txt
        continue-on-error: true 

      # Análisis estático de seguridad en el código del backend
      - name: QA Seguridad - Análisis Estático (Bandit)
        run: bandit -r . -x ./tests

      # Ejecuta las pruebas unitarias de Django
      - name: QA Funcional - Pruebas Unitarias (Django)
        run: python manage.py test
        
  # frontend
  qa-frontend:
    name: QA Verificaciones (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend #Apunta a la carpeta de Next.js
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 

    - name: Instalar Dependencias
      run: npm ci

    - name: QA Estático - Validar Código (ESLint)
      run: npm run lint #Revisa que no tenga errores de sintaxis o malas prácticas
      continue-on-error: true # Para que de la advertencia pero continue

    #-  name: QA Funcional - Pruebas del Front
      # run: npm test  
