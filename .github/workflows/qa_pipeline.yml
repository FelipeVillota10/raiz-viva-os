name: Compuertas de Calidad - Rama Pipeline de prueba

on:
  pull_request:
    branches: [desarrollo, pruebas]
  push:
    branches: [desarrollo, pruebas]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Revision de calidad Backend
  qa-backend:
    name: QA Verificaciones (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias de Raíz Viva
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      - name: Validar Sintaxis del Código
        run: python -m compileall .

      - name: QA Seguridad - Escaneo de librerías (Safety)
        run: safety check -r requirements.txt
        continue-on-error: true # Muestra advertencia

      - name: QA Seguridad - Análisis Estático (Bandit)
        run: bandit -r . -x ./tests
        continue-on-error: true # Alertas de seguridad

      - name: QA Funcional - Pruebas Unitarias (Django)
        run: python manage.py test --keepdb
        continue-on-error: true # Pruebas de django
        
  # Revision de calidad frontend
  qa-frontend:
    name: QA Verificaciones (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Instalar Dependencias
        run: npm install --no-audit --no-fund

      - name: QA Estático - Validar Código (ESLint)
        run: npm run lint
        continue-on-error: true # Alertara sobre variables sin uso

      - name: Compilar Proyecto para Producción (Build)
        run: npm run build
        continue-on-error: true
