name: Compuertas de Calidad - Rama Pruebas

on:
  pull_request:
    branches: [pruebas, produccion]
  push:
    branches: [pruebas]

jobs:
  qa-backend:
    name: QA Verificaciones (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias de Raíz Viva
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      # HU-605: Escaneo de vulnerabilidades en el requirements.txt de la raíz
      - name: QA Seguridad - Escaneo de librerías (Safety)
        run: safety check -r requirements.txt

      # HU-605: Análisis estático de seguridad en todo el código del proyecto
      - name: QA Seguridad - Análisis Estático (Bandit)
        run: bandit -r . -x ./tests

      # HU-602: Ejecución de las pruebas unitarias directas desde la raíz
      - name: QA Funcional - Pruebas Unitarias (Django)
        run: python manage.py test
